<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperare Parolă – SONIC GRID</title>
    <link rel="stylesheet" href="assets/css/style.css?v=1.0.2">
</head>
<body>

<div class="auth-layout">
    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
            <a href="login.html">
                <img src="assets/images/sonic-grid-logo.svg" alt="SONIC GRID">
            </a>
        </div>

        <!-- Card -->
        <div class="auth-card">
            <div class="auth-title">Recuperare Parolă</div>
            <p style="text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.4;">
                Introduceți adresa de email asociată contului pentru a primi instrucțiuni de resetare a parolei.
            </p>
            
            <form action="login.html" method="POST" class="auth-form">
                
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="email" class="form-control" name="email" placeholder="Adresa de Email" required>
                </div>

                <button type="submit" class="btn-submit">Trimite Instrucțiuni</button>

                <div class="auth-links" style="justify-content: center; margin-top: 24px;">
                    <a href="login.html" style="display: flex; align-items: center; gap: 4px;">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        Înapoi la Autentificare
                    </a>
                </div>

            </form>
        </div>

        <!-- Footer Text -->
        <div class="auth-footer">
            <div style="font-size: 11px; font-weight: 600; color: var(--text-main); margin-bottom: 8px;">Viitorul contorizării digitale pentru</div>
            <div class="badges">
                <span class="badge badge-blue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
                    Apă Rece
                </span>
                <span class="badge badge-red">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
                    Apă Caldă
                </span>
                <span class="badge badge-yellow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
                    Energie Termică
                </span>
            </div>
            <div class="copyright">
                © 2026 Sonic Metering. Toate drepturile rezervate.
            </div>
        </div>
    </div>
</div>

</body>
</html>
